name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        if: ${{ hashFiles('scripts/*.mjs', 'tests/*.mjs') != '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Validate Bash syntax
        if: ${{ hashFiles('scripts/*.sh') != '' }}
        shell: bash
        run: bash -n scripts/*.sh

      - name: Run ShellCheck
        if: ${{ hashFiles('scripts/*.sh') != '' }}
        shell: bash
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes shellcheck
          fi
          shellcheck scripts/*.sh

      - name: Validate JavaScript syntax
        if: ${{ hashFiles('scripts/*.mjs') != '' }}
        shell: bash
        run: |
          for file in scripts/*.mjs; do
            node --check "$file"
          done

      - name: Enforce content approval gates
        if: ${{ hashFiles('scripts/page-factory.mjs', 'content/pages/pages.json') != '' }}
        run: node scripts/page-factory.mjs --validate-only

      - name: Run Node.js tests
        if: ${{ hashFiles('tests/*.test.mjs') != '' }}
        run: node --test tests/*.test.mjs
